services:
  - type: web
    name: ai-mystery-room
    runtime: node
    # A paid single-instance baseline avoids Free-tier sleeping in production.
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_QUICK_TEXT_MODEL
        value: gemini-3.8-flash
      - key: ENABLE_IMAGE_GENERATION
        value: "false"
      - key: ENABLE_VIDEO_GENERATION
        value: "false"
      - key: MAX_CASE_GENERATIONS_PER_HOUR
        value: "5"
      - key: GENERATION_TIMEOUT_MS
        value: "300000"
